name: WPF UI preview

on:
  push:
    branches: [ "V0.8.2_WPF_UI" ]
    paths: [ "UI/**", ".github/workflows/wpf-preview.yml" ]
  workflow_dispatch:

jobs:
  render:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build UI/SputterControlApp.Wpf/SputterControlApp.Wpf.csproj -c Release
      - name: Render screens
        shell: pwsh
        run: |
          $exe = "UI/SputterControlApp.Wpf/bin/Release/net10.0-windows/SputterControlApp.Wpf.exe"
          $p = Start-Process $exe -ArgumentList "--render-preview", "$PWD/preview" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          Get-ChildItem preview
      - uses: actions/upload-artifact@v4
        with:
          name: wpf-preview
          path: preview/*.png
